name: MA3Wing
options:
  bundleIdPrefix: com.szafranski
  deploymentTarget:
    iOS: "16.0"
targets:
  MA3Wing:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: web/index.html
        buildPhase: resources
      - path: Support/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.szafranski.ma3wing
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: MA3 Wing
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        NSLocalNetworkUsageDescription: "MA3 Wing wysyła i odbiera OSC z grandMA3 (onPC lub konsola) w sieci lokalnej."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
