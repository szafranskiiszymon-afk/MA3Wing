<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MA3 Wing">
<title>MA3 Wing</title>
<style>
html,body{margin:0;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif}
#stage{position:absolute;left:0;top:0;width:1180px;height:820px;transform-origin:0 0;background:#0e0e10;color:#fff;box-sizing:border-box;padding:8px;display:flex;flex-direction:column;gap:8px}
.k{min-width:0;border:1px solid #000;border-radius:5px;font:600 12px -apple-system,Inter,system-ui,sans-serif;box-shadow:0 2px 0 #000;padding:0 2px;white-space:nowrap;overflow:hidden;line-height:1.15;background:#2b2b2f;color:#e5e5ea;-webkit-tap-highlight-color:transparent;touch-action:none}
.k.on{outline:2px solid #ffc71a;transform:scale(.96);box-shadow:none;filter:brightness(1.35)}
.nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:11px;color:inherit;opacity:.65}
.row{display:flex}.col{display:flex;flex-direction:column}
.grid{display:grid}
.track{position:relative;background:#121214;border-radius:4px;touch-action:none}
.slot{position:absolute;left:50%;margin-left:-2px;top:18px;bottom:18px;width:4px;border-radius:2px;background:#000}
.fill{position:absolute;left:50%;margin-left:-2px;bottom:18px;width:4px;border-radius:2px;background:#ffc71a}
.cap{position:absolute;left:50%;height:36px;border-radius:4px;background:#2e2e32;border:1px solid #000;box-shadow:0 2px 3px #000;display:flex;align-items:center}
.cap i{display:block;height:2px;width:100%;background:#e5e5ea}
.track.on .cap{border-color:#ffc71a}
.knob{align-self:center;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:none}
.knob i{width:18px;height:18px;border-radius:50%;background:#101012}
.enc{width:84px;height:84px;border-radius:50%;background:#2a2a2e;border:2px solid #000;box-shadow:0 3px 4px #000;display:flex;align-items:center;justify-content:center;touch-action:none}
.enc .in{width:52px;height:52px;border-radius:50%;background:#1c1c1f;border:1px solid #000;position:relative}
.enc .in b{position:absolute;top:4px;left:50%;margin-left:-1px;width:2px;height:10px;background:#ffc71a}
.mono{font:500 11px ui-monospace,Menlo,monospace}
#stage.vmode .encw{height:100px!important;width:84px!important}
#stage.vmode .enc{width:80px!important;height:80px!important;margin-left:4px}
#stage.vmode .enc .in{width:48px;height:48px}

/* ===== console-style theme (class "ma" on #stage) ===== */
#stage.ma{background:#000;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
#stage.ma .k{border:1px solid #4b4f58;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
  background:linear-gradient(#363a42,#2a2d33);color:#e2e2e2;font:500 12px "Helvetica Neue",Helvetica,Arial,sans-serif}
#stage.ma .k.on{outline:2px solid #f5b400;filter:brightness(1.4);transform:none}
#stage.ma .sub{opacity:.7;font-size:10px}
#stage.ma .pc{position:relative;justify-content:center;padding-top:10px!important}
#stage.ma .pc .sub{position:absolute;left:4px;top:2px;font-size:10px;opacity:.85;line-height:1}
#stage.ma .pc .nm{font-weight:500}
#stage.ma .fgn{display:inline-block;font-size:10px;opacity:.75;margin-right:5px;vertical-align:top}
#stage.ma .mabody{background:#0d0e11!important;border:1px solid #2b2e34;border-radius:3px!important}
#stage.ma .mawin{background:#08090b!important;border:1px solid #2b2e34;border-radius:2px!important}
#stage.ma .matitle{background:linear-gradient(#3b3f47,#2c2f35);border:1px solid #4b4f58;border-radius:2px}
#stage.ma .cmdl{background:#15161a!important;border:1px solid #3a3d44;border-radius:2px!important}
#stage.ma .enc{background:radial-gradient(circle at 50% 40%,#3a3d44,#1d1f23);border:1px solid #555a63;box-shadow:0 2px 6px #000}
#stage.ma .enc .in{background:#15161a;border-color:#4b4f58}
#stage.ma .enc .in b{background:#f5b400}
#stage.ma .track{background:#08090b;border:1px solid #2b2e34;border-radius:2px}
#stage.ma .cap{background:linear-gradient(#4a4e57,#2a2d33)!important;border-color:#000;border-radius:2px}
#hint{position:absolute;left:0;right:0;top:0;bottom:0;display:none;align-items:center;justify-content:center;color:#fff;font:600 20px -apple-system,sans-serif;text-align:center;background:#000;z-index:9;padding:30px}
</style>
</head>
<body>
<div id="stage"></div>
<script>
(function(){
const S={page:1,f:{},kn:{},enc:[0,0,0,0,0],gm:100,m:100,cmd:''};
const stage=document.getElementById('stage');
function el(tag,style,parent,html){const e=document.createElement(tag);if(style)e.style.cssText=style;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e;}
const clamp=v=>Math.round(Math.max(0,Math.min(100,v)));
let lastEl,cmdEl,pageEl,dotEl,hostEl;
let ws=null,wsOk=false,touching=0;
function osc(t){lastEl.textContent=t;}
function tx(addr,type,val){
  if(wsOk){try{ws.send(addr+'\t'+type+'\t'+val);}catch(e){}}
  osc((wsOk?'OSC → ':'BRAK POŁĄCZENIA – ')+addr+' '+(type==='s'?'"'+val+'"':val));
}
function cmdSend(c){tx('/cmd','s',c);}
// Executor key like on the console: if a command is pending in the command line
// (e.g. "Store", "Update", "Copy", "Delete", "Edit", "Label"...), the key completes it with
// that executor instead of firing the executor: "Store" + key 201 -> Store Exec 1.201

const swallowed=new Set();
function keyMsg(n,d){
  if(d&&S.cmd.trim()){                        // e.g. "Store " waiting -> "Store Exec 201"
    swallowed.add(n);completeWith('Exec '+n);return;
  }
  if(!d&&swallowed.has(n)){swallowed.delete(n);return;}
  tx('/Page'+S.page+'/Key'+n,'i',d?1:0);
}
function connect(){
  if(!/^https?:/.test(location.protocol)){hostEl.textContent='otwórz przez adres laptopa';return;}
  try{ws=new WebSocket('ws://'+location.host+'/ws');}catch(e){setTimeout(connect,2000);return;}
  ws.onopen=()=>{wsOk=true;dotEl.style.background='#34c759';hostEl.textContent='połączono: '+location.host;};
  ws.onclose=()=>{wsOk=false;dotEl.style.background='#ff453a';hostEl.textContent='brak połączenia – ponawiam…';setTimeout(connect,1500);};
  ws.onerror=()=>{try{ws.close()}catch(e){}};
  ws.onmessage=e=>{String(e.data).split('\n').forEach(l=>{try{feedback(l);}catch(err){}});};
}
// feedback from onPC: "fb<TAB>/gma3/Page1/Fader201<TAB>65"
let redrawPending=false;
function scheduleRedraw(){if(redrawPending)return;redrawPending=true;requestAnimationFrame(()=>{redrawPending=false;redrawAll.forEach(f=>f());});}
function feedback(line){
  const p=line.split('\t');if(p[0]!=='fb')return;
  if(/^ATTR/.test(p[1]||'')){attrFeedback(p[1],p[2]||'');return;}
  if(/^EXEC\d+$/.test(p[1]||'')){applyExec(+p[1].slice(4),p[2]||'');return;}
  if(/^(GRP|PRE\d+\.)/.test(p[1]||'')){poolFeedback(p[1],p[2]||'');return;}
  if(/^LAY/.test(p[1]||'')){layoutFeedback(p[1],p[2]||'');return;}
  if(p[1]==='KEYS'){maTyped=(p[2]==='ok');return;}
  if(p[1]==='CMDLINE'){if(!maTyped&&S.cmd)return;/* pending command lives only on the iPad */S.cmd=(p[2]||'').replace(/^\s+/,'');if(S.cmd&&!/ $/.test(S.cmd))S.cmd+=' ';showCmd();return;}
  if(touching>0)return;
  const m=/Page(\d+)\/Fader(\d+)$/.exec(p[1]||'');const v=parseFloat(p[2]);
  if(!m||isNaN(v)||+m[1]!==S.page)return;
  const n=+m[2],val=clamp(v);
  if(n>=300)S.kn[n]=val;else S.f[n]=val;
  scheduleRedraw();
}
function vib(){if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}}
function showCmd(){if(!S.cmd.trim())S.storeOpt='';cmdEl.innerHTML='<span style="color:#ffc71a">['+S.page+']&gt;</span> '+S.cmd.replace(/</g,'&lt;')+(S.storeOpt?'<span style="color:#b4b3ff"> '+esc(S.storeOpt)+'</span>':'');}

// momentary key (multi-touch safe)
function key(parent,label,style,onDown,onUp,sub){
  const b=el('button','height:40px;'+(style||''),parent);b.className='k';
  b.innerHTML=label+(sub?'<br><span class="sub">'+sub+'</span>':'');
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}b.classList.add('on');vib();onDown&&onDown();});
  const up=e=>{if(!b.classList.contains('on'))return;b.classList.remove('on');onUp&&onUp();};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
  return b;
}
// fader: relative drag, many at once
function fader(parent,style,capW,capColor,get,set){
  const t=el('div',style,parent);t.className='track';
  el('div','',t).className='slot';
  const fl=el('div','',t);fl.className='fill';
  const cp=el('div','width:'+capW+'px;margin-left:-'+(capW/2)+'px;background:'+capColor,t,'<i></i>');cp.className='cap';
  function draw(){const v=get(),h=t.clientHeight-36;fl.style.height=(h*v/100)+'px';cp.style.top=(h*(1-v/100))+'px';}
  let st=null;
  t.addEventListener('pointerdown',e=>{e.preventDefault();try{t.setPointerCapture(e.pointerId)}catch(x){}if(!st)touching++;st={y:e.clientY,v:get()};t.classList.add('on');});
  t.addEventListener('pointermove',e=>{if(!st)return;const h=(t.clientHeight-36)*scale;const nv=clamp(st.v+(st.y-e.clientY)/h*100);if(nv!==get()){set(nv);draw();}});
  const end=()=>{if(st)touching=Math.max(0,touching-1);st=null;t.classList.remove('on');};
  t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end);
  t.draw=draw;return t;
}
function knob(parent,n){
  const k=el('div','',parent,'<i></i>');k.className='knob';
  const draw=()=>{k.style.background='conic-gradient('+(k.col||'#ffc71a')+' '+((S.kn[n]||0)*3.6)+'deg,#3a3a3f 0)';};
  let st=null;
  k.addEventListener('pointerdown',e=>{e.preventDefault();try{k.setPointerCapture(e.pointerId)}catch(x){}st={y:e.clientY,v:S.kn[n]||0};});
  k.addEventListener('pointermove',e=>{if(!st)return;const nv=clamp(st.v+(st.y-e.clientY)/scale*0.6);const d=nv-(S.kn[n]||0);if(d===0)return;S.kn[n]=nv;draw();tx('/Page'+S.page+'/Encoder'+n,'i',d);});
  const end=()=>{st=null};k.addEventListener('pointerup',end);k.addEventListener('pointercancel',end);
  k.draw=draw;draw();return k;
}
// ===== executor names / colors from MA (plugin v5: EXECnnn=name|#rrggbb) =====
const EX={};   // n -> {keys:[{b,num,mark}], track, knob}
function exReg(n,part,el,mark){const e=EX[n]||(EX[n]={keys:[]});if(part==='key')e.keys.push({b:el,num:String(n),mark:mark||''});else e[part]=el;return el;}
function shade(hex,f){const v=parseInt(hex.slice(1),16);const r=(v>>16)&255,g=(v>>8)&255,b=v&255;
  return 'rgb('+Math.round(r*f)+','+Math.round(g*f)+','+Math.round(b*f)+')';}
function lum(hex){const v=parseInt(hex.slice(1),16);return (0.299*((v>>16)&255)+0.587*((v>>8)&255)+0.114*(v&255))/255;}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function applyExec(n,v){
  const e=EX[n];if(!e)return;
  const q=String(v).split('|');const name=(q[0]||'').trim();const col=/^#[0-9a-f]{6}$/i.test(q[1]||'')?q[1]:'';
  e.keys.forEach(k=>{
    const isX=k.mark.indexOf('X')===0;
    if(isX){const xl=k.mark.split('|');   // Xkeys: name from the show, or the console label
      k.b.innerHTML=name?'<span class="nm">'+esc(name)+'</span><span class="sub">'+xl[0]+'</span>':xl[0]+'<br><span class="sub">'+(xl[1]||'')+'</span>';}
    else k.b.innerHTML=(name?'<span class="nm">'+esc(name)+'</span>':k.num+'<br>')+'<span class="sub">'+(name?k.num:k.mark)+'</span>';
    if(col){k.b.style.background=shade(col,0.42);k.b.style.boxShadow='inset 0 3px 0 '+col+', 0 2px 0 #000';k.b.style.color=lum(col)>0.85?'#fff':'#fff';}
    else{k.b.style.background='';k.b.style.boxShadow='';k.b.style.color='';}
    if(!isX)k.b.style.fontSize=name&&name.length>6?'10px':'';
  });
  if(e.track){const fl=e.track.querySelector('.fill');const cp=e.track.querySelector('.cap i');
    fl.style.background=col||'';cp.style.background=col||'';e.track.style.boxShadow=col?'inset 0 3px 0 '+col:'';}
  if(e.knob){e.knob.col=col||'';e.knob.draw();}
}

// command line keypad logic
// Command keys are TYPED into the real MA command line on the laptop (the bridge
// acts as a keyboard), exactly like pressing the key on a console: "Store" waits in MA's
// command line and you can finish it with the mouse in onPC or with an executor key.
// S.cmd only mirrors what we typed (MA may consume it when you click in onPC).
// Finish a pending command with an object. Works whether onPC is visible or minimized:
// Esc clears what we typed into MA (skipped by the bridge if onPC is minimized), then the whole
// command goes over OSC, e.g. "Store Preset 2.3".
let maTyped=true;      // false when the bridge could not type into onPC (minimized)
function completeWith(obj){
  let c=S.cmd.trim();
  // Assign/Copy/Move/Clone without a source yet: the tapped object is the SOURCE, so just put it
  // into the command line and wait for the target (e.g. Assign, Group 5, then fader key 201)
  if(/^(Assign|Copy|Move|Clone)$/i.test(c)){const t=' '+obj+' ';typeText(t);S.cmd=c+t;showCmd();osc('MA linia komend ← '+S.cmd+' (wybierz cel)');return;}
  // Assign/Copy/Move/Clone need "At" before the target: "Assign Group 5 At Exec 201"
  if(/^(Assign|Copy|Move|Clone)\b/i.test(c)&&/\d/.test(c)&&!/\b(At|Thru|\+|-)$/i.test(c))c+=' At';
  if(/^Store$/i.test(c)&&!S.storeOpt){const ex=storeTargetExists(obj);
    if(ex){typeKey('{ESC}');openStoreOpts({cmd:c,obj:obj,label:ex.label});return;}}
  typeKey('{ESC}');cmdSend(c+' '+obj+(S.storeOpt&&/^Store\b/i.test(c)?' '+S.storeOpt:''));S.cmd='';S.storeOpt='';showCmd();
}
function typeText(t){if(wsOk){try{ws.send('!keys\tt\t'+t);}catch(e){}}}
function typeKey(k){if(wsOk){try{ws.send('!keys\tk\t'+k);}catch(e){}}}
// press/release of a real MA key via its keyboard shortcut (Store=S, Update=U): holding works like on the console
function holdKey(dir,letter){if(wsOk){try{ws.send('!hold\t'+dir+'\t'+letter);}catch(e){}}}
function holdBtn(parent,label,letter,bg,fg){
  let held=false,timer=null,longp=false;
  return key(parent,label,'height:auto;min-height:0;background:'+bg+';color:'+fg,
    ()=>{holdKey('d',letter);held=true;longp=false;const c=S.cmd;S.cmd=c+(c&&!/ $/.test(c)?' ':'')+label+' ';showCmd();
      osc('MA klawisz '+label+(letter==='S'?' (przytrzymaj = opcje Store)':''));
      if(letter==='S'){clearTimeout(timer);timer=setTimeout(()=>{if(held){holdKey('u',letter);held=false;longp=true;openStoreOpts();}},350);}},
    ()=>{clearTimeout(timer);if(held){holdKey('u',letter);held=false;}});
}
// ===== Store options (like MA's Store window): Merge / Overwrite / Remove / Create Second Cue ...
// Chosen option is appended at the end: "Store Preset 2.4 /Merge"
S.storeOpt='';
const SOPTS=[['/Merge','Merge','Dodaje nowe wartości do istniejących'],['/Overwrite','Overwrite','Zastępuje całą zawartość'],
  ['/Remove','Remove','Usuwa wartości z programatora z obiektu'],['/CreateSecondCue','Create Second Cue','Tworzy drugi cue w sekwencji']];
const SFLAGS=[['/CueOnly','Cue Only'],['/Selective','Selective'],['/Global','Global'],['/Universal','Universal']];
let soFlags=[],soPending=null;
const soWrap=el('div','position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9',stage);
soWrap.addEventListener('pointerdown',e=>{if(e.target===soWrap){e.preventDefault();closeStoreOpts(false);}});
const soBox=el('div','width:640px;background:#1a1a1d;border:1px solid #3a3a3f;border-radius:14px;box-shadow:0 10px 40px #000;padding:14px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px',soWrap);soBox.classList.add('mabody');
const soTitle=el('div','font:600 16px -apple-system,sans-serif;display:flex;align-items:center;gap:8px',soBox,'');
const soMain=el('div','display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px',soBox);
el('div','font:600 11px -apple-system,sans-serif;color:#8e8e93;text-transform:uppercase;letter-spacing:.5px;margin-top:4px',soBox,'Dodatkowo');
const soFl=el('div','display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px',soBox);
const soFoot=el('div','display:flex;gap:8px;margin-top:4px',soBox);
function soFlagStr(){return soFlags.join(' ');}
function renderStoreOpts(){
  soTitle.innerHTML=soPending?'<span>Obiekt <b style="color:#ffc71a">'+esc(soPending.label)+'</b> już istnieje – co zrobić?</span>':'<span>Opcje <b style="color:#ffc71a">Store</b></span>';
  soMain.innerHTML='';
  SOPTS.forEach(o=>{if(soPending&&o[0]==='/CreateSecondCue'&&!/^(Cue|Exec|Sequence)/i.test(soPending.obj))return;
    const on=!soPending&&S.storeOpt===o[0];
    key(soMain,o[1]+'<br><span class="sub" style="white-space:normal">'+o[2]+'</span>','height:64px;white-space:normal;font-size:15px;background:'+(on?'#ffc71a':'#a32a26')+';color:'+(on?'#1a1400':'#fff'),()=>chooseStoreOpt(o[0]));});
  soFl.innerHTML='';
  SFLAGS.forEach(f=>{const on=soFlags.indexOf(f[0])>=0;
    key(soFl,f[1],'height:40px'+(on?';background:#5e5ce6;color:#fff':''),()=>{const i=soFlags.indexOf(f[0]);if(i>=0)soFlags.splice(i,1);else soFlags.push(f[0]);renderStoreOpts();});});
  soFoot.innerHTML='';
  if(!soPending)key(soFoot,'Bez opcji','height:44px;flex:1',()=>chooseStoreOpt(''));
  key(soFoot,'Anuluj','height:44px;flex:1;background:'+A+';color:'+AT,()=>closeStoreOpts(false));
}
function openStoreOpts(pending){soPending=pending||null;renderStoreOpts();soWrap.style.display='flex';}
function closeStoreOpts(keep){soWrap.style.display='none';
  if(!keep&&soPending){S.cmd='';S.storeOpt='';showCmd();osc('Store anulowany');}
  soPending=null;}
function chooseStoreOpt(o){
  if(soPending){const p=soPending;soPending=null;soWrap.style.display='none';
    cmdSend([p.cmd,p.obj,o,soFlagStr()].filter(Boolean).join(' '));S.cmd='';S.storeOpt='';soFlags=[];showCmd();return;}
  S.storeOpt=[o,soFlagStr()].filter(Boolean).join(' ');soWrap.style.display='none';showCmd();
  osc('Store '+(S.storeOpt||'bez opcji')+' – wybierz cel (executor, preset, grupę…)');
}
function storeTargetExists(obj){
  let m=/^Preset (\d+)\.(\d+)$/.exec(obj);if(m){const P=POOLS['PRE'+m[1]+'.'];return P&&P.items[+m[2]]?{label:'Preset '+m[1]+'.'+m[2]+' "'+P.items[+m[2]].name+'"'}:null;}
  m=/^Group (\d+)$/.exec(obj);if(m){const it=POOLS.GRP.items[+m[1]];return it?{label:'Group '+m[1]+' "'+it.name+'"'}:null;}
  return null;
}
function pad(kind,v){
  const c=S.cmd;
  if(kind==='d'){const t=(c&&!/[0-9. ]$/.test(c))?' '+v:v;typeText(t);S.cmd=c+t;}
  else if(kind==='dot'){typeText('.');S.cmd=c+'.';}
  else if(kind==='kw'){const t=(c&&!/ $/.test(c)?' ':'')+v+' ';typeText(t);S.cmd=c+t;}
  else if(kind==='dir')cmdSend(v);
  else if(kind==='please'){if(c.trim()){typeKey('{ESC}');cmdSend(c.trim()+(S.storeOpt&&/^Store\b/i.test(c.trim())?' '+S.storeOpt:''));}else typeKey('{ENTER}');S.cmd='';S.storeOpt='';}
  else if(kind==='clear'){if(c){typeKey('{ESC}');S.cmd='';}else cmdSend('Clear');}
  else if(kind==='oops'){if(c){const m=/(\S+\s*)$/.exec(c);const n=m?m[1].length:1;typeKey('{BS '+n+'}');S.cmd=c.slice(0,c.length-n);}else cmdSend('Oops');}
  else if(kind==='bs'){typeKey('{BS}');S.cmd=c.slice(0,-1);}
  else if(kind==='esc'){typeKey('{ESC}');S.cmd='';}
  osc(wsOk?'MA linia komend ← '+(S.cmd||'(pusta)'):'BRAK POŁĄCZENIA');
  showCmd();
}

const FG_ORDER=['Dimmer','Position','Gobo','Color','Beam','Focus','Control','Shapers','Video'];
const FG_DEFAULT={Dimmer:['Dimmer'],Position:['Pan','Tilt'],Gobo:['Gobo1','Gobo1Pos','Gobo2','Gobo2Pos','Prism1'],
  Color:['ColorRGB_R','ColorRGB_G','ColorRGB_B','Color1','CTO'],Beam:['Shutter1','Iris','Frost1','Prism1','Effects1'],
  Focus:['Zoom','Focus1','Focus2'],Control:['Control1'],Shapers:['Blade1A','Blade1B','Blade2A','Blade2B','ShaperRot'],Video:[]};
function guessGroup(n){
  if(/^Dim/i.test(n))return 'Dimmer';if(/^(Pan|Tilt|Position)/i.test(n))return 'Position';
  if(/^(Gobo|Animation)/i.test(n))return 'Gobo';if(/^(Color|CTO|CTC|CTB|Hue|Sat|Tint)/i.test(n))return 'Color';
  if(/^(Blade|Shaper)/i.test(n))return 'Shapers';if(/^(Zoom|Focus)/i.test(n))return 'Focus';
  if(/^(Shutter|Strobe|Iris|Prism|Frost|Effect|Beam)/i.test(n))return 'Beam';if(/^(Video|Media)/i.test(n))return 'Video';
  return 'Control';
}
let maAttrs=[],maAttrN=-1;            // [{g,name,pretty}] from MA

function groupAttrs(g){
  if(maAttrs.length){return maAttrs.filter(a=>a.g===g).map(a=>({name:a.name,pretty:a.pretty,min:a.min,max:a.max,sets:a.sets}));}
  return (FG_DEFAULT[g]||[]).map(n=>({name:n,pretty:n}));
}
function groupsAvailable(){
  if(!maAttrs.length)return FG_ORDER.filter(g=>(FG_DEFAULT[g]||[]).length);
  const set=[];maAttrs.forEach(a=>{if(set.indexOf(a.g)<0)set.push(a.g);});
  return FG_ORDER.filter(g=>set.indexOf(g)>=0).concat(set.filter(g=>FG_ORDER.indexOf(g)<0));
}
function renderEncoders(){
  const list=groupAttrs(curGroup),pages=Math.max(1,Math.ceil(list.length/5));
  if(encPage>=pages)encPage=pages-1;
  for(let i=0;i<5;i++){encSlot[i]=list[encPage*5+i]||null;if(encLabs[i])encLabs[i].textContent=encSlot[i]?encSlot[i].pretty:'—';}
  Object.keys(fgBtns).forEach(g=>{const b=fgBtns[g];const on=g===curGroup;b.style.background=on?'#ffc71a':'#2b2b2f';b.style.color=on?'#1a1400':'#e5e5ea';});
  if(pgLab)pgLab.textContent=(encPage+1)+'/'+pages;
}
function renderGroupBar(){
  if(!fgBar)return;fgBar.innerHTML='';fgBtns={};

}

const cPad=el('div','width:330px;flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:5px',cMain);
const cSide=el('div','flex:1;min-width:0;display:flex;flex-direction:column;gap:6px',cMain);
const cTabs=el('div','display:flex;gap:4px;height:34px;flex:none',cSide);
const cList=el('div','flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:44px;gap:5px;align-content:start',cSide);
const cNav=el('div','display:flex;gap:4px;height:30px;flex:none',cSide);
let calcIdx=-1,calcTxt='',calcTab='sets',calcPage=0,calcMode='val',calcAll=false;
const CMODES=[['val','Wartość'],['fade','Fade'],['delay','Delay']];
function calcAttr(){return encSlot[calcIdx];}
function calcShow(){cInput.textContent=calcTxt||' ';}
function calcKey(t){
  if(t==='Back')calcTxt=calcTxt.slice(0,-1);
  else if(t==='Clear')calcTxt='';
  else if(t==='+'||t==='-'||t==='Thru'){calcTxt=calcTxt.replace(/\s+$/,'')+(calcTxt?' ':'')+t+' ';}
  else calcTxt+=t;
  calcShow();
}
function calcPlease(){
  const a=calcAttr(),v=calcTxt.trim();if(!v){closeCalc();return;}
  if(calcMode==='val'){if(a)cmdSend('Attribute "'+a.name+'" At '+v);closeCalc();return;}
  calcTime(v);
}
[['7'],['8'],['9'],['+'],['Back'],['4'],['5'],['6'],['Thru'],['Clear'],['1'],['2'],['3'],['-'],['%'],['0'],['.'],['/'],['*'],['+/-']].forEach(a=>{
  const t=a[0],num=/^[0-9.]$/.test(t);
  key(cPad,t,'height:auto;min-height:0;font-size:'+(num?'18':'13')+'px'+(num?';background:#3a3a3f;color:#fff':'')+(t==='Clear'?';background:'+A+';color:'+AT:''),()=>{
    if(t==='+/-'){calcTxt=/^-/.test(calcTxt)?calcTxt.slice(1):'-'+calcTxt;calcShow();}else calcKey(t);});
});
const cPl=key(cPad,'Please','height:auto;min-height:0;grid-column:span 5;background:'+G+';color:#fff;font-size:15px',()=>calcPlease());
// Fade / Delay of the attribute (or of all attributes of the selection), like MA's Fade/Delay layer:
// Attribute "Pan" At Fade 2  |  At Delay 0.5
function calcTime(v){
  const a=calcAttr(),kw=calcMode==='fade'?'Fade':'Delay';
  cmdSend((calcAll||!a?'':'Attribute "'+a.name+'" ')+'At '+kw+' '+v);
  calcTxt='';calcShow();closeCalc();
}
function presetTypeFor(a){if(!a)return 0;const g=(maAttrs.find(x=>x.name===a.name)||{}).g||guessGroup(a.name);return g==='Position'?2:(g==='Focus'?6:0);}
function renderCalc(){
  const a=calcAttr();
  if(!a){cTitleT.innerHTML='Brak atrybutu na tym enkoderze';cList.innerHTML='';cTabs.innerHTML='';return;}
  const rng=(a.min!==''&&a.max!==''&&a.min!==undefined)?' <span style="color:#8e8e93;font-weight:400">['+esc(a.min)+' .. '+esc(a.max)+']</span>':'';
  cTitleT.innerHTML='Edit <b style="color:#ffc71a">'+esc(a.pretty||a.name)+'</b>'+rng+' <span style="color:#8e8e93;font-weight:400;font-size:12px">'+esc(curGroup)+' · enkoder '+(calcIdx+1)+'</span>';
  cModes.innerHTML='';
  CMODES.forEach(m=>{const on=m[0]===calcMode;key(cModes,m[1],'height:40px;width:78px;flex:none'+(on?';background:'+(m[0]==='val'?'#ffc71a':'#5e5ce6')+';color:'+(m[0]==='val'?'#1a1400':'#fff'):''),()=>{calcMode=m[0];calcTxt='';calcShow();renderCalc();});});
  const timed=calcMode!=='val';
  cAllBtn.style.visibility=timed?'visible':'hidden';
  cAllBtn.innerHTML=calcAll?'Wszystkie atrybuty<br><span class="sub">zaznaczenia</span>':'Tylko <b>'+esc(a.pretty||a.name)+'</b>';
  cAllBtn.style.background=calcAll?'#5e5ce6':'';cAllBtn.style.color=calcAll?'#fff':'';
  cInput.style.color=timed?'#b4b3ff':'#ffc71a';
  if(timed){
    cTitleT.innerHTML=(calcMode==='fade'?'Fade':'Delay')+' <span style="color:#8e8e93;font-weight:400">(sekundy)</span> · '+(calcAll?'wszystkie atrybuty zaznaczenia':'<b style="color:#ffc71a">'+esc(a.pretty||a.name)+'</b>');
    cTabs.innerHTML='';key(cTabs,'Szybki czas','height:34px;width:160px;flex:none;background:#5e5ce6;color:#fff');
    cList.innerHTML='';cNav.style.visibility='hidden';
    ['0','0.2','0.5','1','1.5','2','3','4','5','8','10','15'].forEach(t=>key(cList,t+' s','height:auto;font-size:15px;background:#2f3036',()=>calcTime(t)));
    return;
  }
  const pt=presetTypeFor(a);
  if(calcTab==='presets'&&!pt)calcTab='sets';
  cTabs.innerHTML='';
  const tabs=[['sets','Channel Sets']];if(pt)tabs.push(['presets','Presety '+(pt===2?'Position':'Focus')]);
  tabs.forEach(t=>{const on=t[0]===calcTab;key(cTabs,t[1],'height:34px;width:160px;flex:none'+(on?';background:#ffc71a;color:#1a1400':''),()=>{calcTab=t[0];calcPage=0;renderCalc();});});
  let items=[];
  if(calcTab==='sets')items=(a.sets||[]).map(s=>{const q=s.split('~');
    if(q.length>=3&&q[2]!=='')return {label:q[1],sub:q[0],fn:q[0],run:()=>cmdSend('Attribute "'+a.name+'" At Absolute Decimal24 '+q[2])};   // plugin v13: function~name~dmx24
    return {label:s,sub:a.pretty||a.name,run:()=>cmdSend('Attribute "'+a.name+'" At ChannelSet "'+s.replace(/"/g,'')+'"')};});
  else{const P=POOLS['PRE'+pt+'.'];items=(P.list||[]).map(n=>({label:(P.items[n]||{}).name||('Preset '+pt+'.'+n),sub:pt+'.'+n,col:(P.items[n]||{}).col,run:()=>objTap('Preset '+pt+'.'+n,'At Preset '+pt+'.'+n)}));}
  const per=15,pages=Math.max(1,Math.ceil(items.length/per));if(calcPage>=pages)calcPage=pages-1;
  cList.innerHTML='';
  if(!items.length)el('div','grid-column:span 3;color:#8e8e93;font-size:13px;padding:10px;line-height:1.4',cList,
    calcTab==='sets'?(maAttrs.length?'Ten atrybut nie ma channel setów (albo wtyczka w onPC jest starsza niż v12).':'Zaznacz urządzenie w MA – wtyczka v12 odczyta jego channel sety.'):'Brak presetów.');
  const fnCols=['#2f3036','#2b3a4a','#3a2f48','#2f4636','#4a3a2b','#2b4646','#46302f'],fnIdx={};let fnN=0;
  items.forEach(it=>{if(it.fn&&!(it.fn in fnIdx))fnIdx[it.fn]=fnN++;});
  items.slice(calcPage*per,(calcPage+1)*per).forEach(it=>{if(it.fn&&!it.col)it.bg=fnCols[fnIdx[it.fn]%fnCols.length];
    const b=key(cList,'<span class="nm" style="white-space:normal;max-height:2.4em">'+esc(it.label)+'</span><span class="sub">'+esc(it.sub)+'</span>','height:auto;white-space:normal;line-height:1.2'+
      (it.col?';background:'+shade(it.col,0.42)+';box-shadow:inset 0 3px 0 '+it.col:';background:'+(it.bg||'#2f3036')),()=>{it.run();closeCalc();});
  });
  cNav.innerHTML='';cNav.style.visibility=pages>1?'visible':'hidden';
  key(cNav,'◀','height:30px;flex:1',()=>{if(calcPage>0){calcPage--;renderCalc();}});
  el('div','width:50px;text-align:center;color:#a1a1a6;align-self:center',cNav,(calcPage+1)+'/'+pages).className='mono';
  key(cNav,'▶','height:30px;flex:1',()=>{if(calcPage<pages-1){calcPage++;renderCalc();}});
}
function openCalc(i){calcIdx=i;calcTxt='';calcMode='val';calcPage=0;calcTab='sets';calcShow();calc.style.display='flex';renderCalc();}
function closeCalc(){calc.style.display='none';calcIdx=-1;}
function stepCalc(d){let n=calcIdx;for(let k=0;k<5;k++){n=(n+d+5)%5;if(encSlot[n])break;}calcIdx=n;calcTxt='';calcPage=0;calcShow();renderCalc();}
function showTab(t){
  curTab=t;poolPage=0;
  const wing=t==='Wing',lay=t==='Views';
  ex.style.display=wing?'flex':'none';ms.style.display=wing?'flex':'none';
  poolView.style.display=(!wing&&!lay)?'flex':'none';layView.style.display=lay?'flex':'none';
  if(lay){                      // encoders to the bottom strip, command section into the drawer
    sC.appendChild(fgRow);sC.appendChild(er);dBody.appendChild(cs);body.style.padding='10px 30px 10px 10px';stage.classList.add('vmode');er.style.height='100px';
  } else {
    cs.insertBefore(er,cs.firstChild);cs.insertBefore(fgRow,er);body.appendChild(cs);body.style.padding='16px';stage.classList.remove('vmode');er.style.height='104px';
    setDrawer(false);
  }
  setDrawer(false);
  Object.keys(tabBtns).forEach(k=>{const on=k===t;tabBtns[k].style.background=on?'#ffc71a':'';tabBtns[k].style.color=on?'#1a1400':'';});
  if(lay)renderViews();else if(!wing)renderPool();
  redrawAll.forEach(f=>f());
}
showTab('Wing');

// ---- scale to screen
let scale=1;
function fit(){
  const vw=document.documentElement.clientWidth||window.innerWidth||1180,vh=window.innerHeight;
  scale=vw/1180;
  if(vh>200&&vh/820<scale)scale=vh/820;
  stage.style.transform='scale('+scale+')';
  stage.style.left=((vw-1180*scale)/2)+'px';stage.style.top='0px';
  document.body.style.height=Math.ceil(820*scale)+'px';
  redrawAll.forEach(f=>f());
}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>setTimeout(fit,200));
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
window.__fb=feedback;   // test hook
fit();
connect();
})();
</script>
