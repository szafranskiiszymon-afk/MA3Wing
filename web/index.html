<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MA3 Wing">
<title>MA3 Wing</title>
<style>
html,body{margin:0;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif}
#stage{position:absolute;left:0;top:0;width:1180px;height:820px;transform-origin:0 0;background:#0e0e10;color:#fff;box-sizing:border-box;padding:8px;display:flex;flex-direction:column;gap:8px}
.k{min-width:0;border:1px solid #000;border-radius:5px;font:600 12px -apple-system,Inter,system-ui,sans-serif;box-shadow:0 2px 0 #000;padding:0 2px;white-space:nowrap;overflow:hidden;line-height:1.15;background:#2b2b2f;color:#e5e5ea;-webkit-tap-highlight-color:transparent;touch-action:none}
.k.on{outline:2px solid #ffc71a;transform:scale(.96);box-shadow:none;filter:brightness(1.35)}
.nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:11px;color:inherit;opacity:.65}
.row{display:flex}.col{display:flex;flex-direction:column}
.grid{display:grid}
.track{position:relative;background:#121214;border-radius:4px;touch-action:none}
.slot{position:absolute;left:50%;margin-left:-2px;top:18px;bottom:18px;width:4px;border-radius:2px;background:#000}
.fill{position:absolute;left:50%;margin-left:-2px;bottom:18px;width:4px;border-radius:2px;background:#ffc71a}
.cap{position:absolute;left:50%;height:36px;border-radius:4px;background:#2e2e32;border:1px solid #000;box-shadow:0 2px 3px #000;display:flex;align-items:center}
.cap i{display:block;height:2px;width:100%;background:#e5e5ea}
.track.on .cap{border-color:#ffc71a}
.knob{align-self:center;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:none}
.knob i{width:18px;height:18px;border-radius:50%;background:#101012}
.enc{width:84px;height:84px;border-radius:50%;background:#2a2a2e;border:2px solid #000;box-shadow:0 3px 4px #000;display:flex;align-items:center;justify-content:center;touch-action:none}
.enc .in{width:52px;height:52px;border-radius:50%;background:#1c1c1f;border:1px solid #000;position:relative}
.enc .in b{position:absolute;top:4px;left:50%;margin-left:-1px;width:2px;height:10px;background:#ffc71a}
.mono{font:500 11px ui-monospace,Menlo,monospace}
#stage.vmode .encw{height:100px!important;width:84px!important}
#stage.vmode .enc{width:80px!important;height:80px!important;margin-left:4px}
#stage.vmode .enc .in{width:48px;height:48px}

/* ===== console-style theme (class "ma" on #stage) ===== */
#stage.ma{background:#000;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
#stage.ma .k{border:1px solid #4b4f58;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
  background:linear-gradient(#363a42,#2a2d33);color:#e2e2e2;font:500 12px "Helvetica Neue",Helvetica,Arial,sans-serif}
#stage.ma .k.on{outline:2px solid #f5b400;filter:brightness(1.4);transform:none}
#stage.ma .sub{opacity:.7;font-size:10px}
#stage.ma .pc{position:relative;justify-content:center;padding-top:10px!important}
#stage.ma .pc .sub{position:absolute;left:4px;top:2px;font-size:10px;opacity:.85;line-height:1}
#stage.ma .pc .nm{font-weight:500}
#stage.ma .fgn{display:inline-block;font-size:10px;opacity:.75;margin-right:5px;vertical-align:top}
#stage.ma .mabody{background:#0d0e11!important;border:1px solid #2b2e34;border-radius:3px!important}
#stage.ma .mawin{background:#08090b!important;border:1px solid #2b2e34;border-radius:2px!important}
#stage.ma .matitle{background:linear-gradient(#3b3f47,#2c2f35);border:1px solid #4b4f58;border-radius:2px}
#stage.ma .cmdl{background:#15161a!important;border:1px solid #3a3d44;border-radius:2px!important}
#stage.ma .enc{background:radial-gradient(circle at 50% 40%,#3a3d44,#1d1f23);border:1px solid #555a63;box-shadow:0 2px 6px #000}
#stage.ma .enc .in{background:#15161a;border-color:#4b4f58}
#stage.ma .enc .in b{background:#f5b400}
#stage.ma .track{background:#08090b;border:1px solid #2b2e34;border-radius:2px}
#stage.ma .cap{background:linear-gradient(#4a4e57,#2a2d33)!important;border-color:#000;border-radius:2px}
#hint{position:absolute;left:0;right:0;top:0;bottom:0;display:none;align-items:center;justify-content:center;color:#fff;font:600 20px -apple-system,sans-serif;text-align:center;background:#000;z-index:9;padding:30px}
</style>
</head>
<body>
<div id="stage"></div>
<script>
(function(){
const S={page:1,f:{},kn:{},enc:[0,0,0,0,0],gm:100,m:100,xf:0,cmd:''};
let layEls=[],laySel=[],layInternal=false;
let layDir={right:true,down:true};
let laySelMode='lin';try{laySelMode=localStorage.getItem('ma3wing.selmode')||'lin';}catch(e){}
const stage=document.getElementById('stage');
function el(tag,style,parent,html){const e=document.createElement(tag);if(style)e.style.cssText=style;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e;}
const clamp=v=>Math.round(Math.max(0,Math.min(100,v)));
let lastEl,cmdEl,pageEl,dotEl,hostEl;
let ws=null,wsOk=false,touching=0;
function osc(t){lastEl.textContent=t;}
function tx(addr,type,val){
  if(wsOk){try{ws.send(addr+'\t'+type+'\t'+val);}catch(e){}}
  osc((wsOk?'OSC → ':'BRAK POŁĄCZENIA – ')+addr+' '+(type==='s'?'"'+val+'"':val));
}
function cmdSend(c){tx('/cmd','s',c);}
// Executor key like on the console: if a command is pending in the command line
// (e.g. "Store", "Update", "Copy", "Delete", "Edit", "Label"...), the key completes it with
// that executor instead of firing the executor: "Store" + key 201 -> Store Exec 1.201

const swallowed=new Set();
function keyMsg(n,d){
  if(d&&S.cmd.trim()){                        // e.g. "Store " waiting -> "Store Exec 201"
    swallowed.add(n);completeWith('Exec '+n);return;
  }
  if(!d&&swallowed.has(n)){swallowed.delete(n);return;}
  tx('/Page'+S.page+'/Key'+n,'i',d?1:0);
}
// iPad app (WKWebView): window.MA3_CFG comes from the app. mode 'direct' = the app itself talks OSC to MA
// (WebSocket is replaced by the app's native link), mode 'bridge' = through the laptop bridge like in Safari.
const NATIVE=!!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.ma);
const CFG=window.MA3_CFG||{mode:'direct',ip:'',send:8000,recv:9000,prefix:'gma3',bridge:''};
function linkName(){if(!NATIVE)return location.host;return CFG.mode==='bridge'?'laptop '+CFG.bridge:'MA '+(CFG.ip||'?')+':'+CFG.send;}
function connect(){
  let url;
  if(NATIVE){
    if(CFG.mode==='bridge'){if(!CFG.bridge){hostEl.textContent='ustaw adres laptopa (⚙)';return;}url='ws://'+CFG.bridge+'/ws';}
    else{if(!CFG.ip){hostEl.textContent='ustaw adres MA (⚙)';return;}url='native://osc';}
  } else {
    if(!/^https?:/.test(location.protocol)){hostEl.textContent='otwórz przez adres laptopa';return;}
    url='ws://'+location.host+'/ws';
  }
  try{ws=new WebSocket(url);}catch(e){setTimeout(connect,2000);return;}
  ws.onopen=()=>{wsOk=true;lastMirror=null;setTimeout(mirrorCmd,50);dotEl.style.background='#34c759';hostEl.textContent='połączono: '+linkName();};
  ws.onclose=()=>{wsOk=false;dotEl.style.background='#ff453a';hostEl.textContent='brak połączenia – ponawiam…';setTimeout(connect,1500);};
  ws.onerror=()=>{try{ws.close()}catch(e){}};
  ws.onmessage=e=>{String(e.data).split('\n').forEach(l=>{try{feedback(l);}catch(err){}});};
}
// feedback from onPC: "fb<TAB>/gma3/Page1/Fader201<TAB>65"
let redrawPending=false;
function scheduleRedraw(){if(redrawPending)return;redrawPending=true;requestAnimationFrame(()=>{redrawPending=false;redrawAll.forEach(f=>f());});}
// show data (names, pools, layouts...) remembered on the iPad, replayed at start
const SHOWKEY='ma3wing.show';let showMap={},showDirty=false;
try{showMap=JSON.parse(localStorage.getItem(SHOWKEY)||'{}')||{};}catch(e){showMap={};}
setInterval(()=>{if(!showDirty)return;showDirty=false;try{localStorage.setItem(SHOWKEY,JSON.stringify(showMap));}catch(e){}},5000);
function rememberShow(k,v){if(/^(\/Page|SEL$|ATTR|CMDLINE|KEYS|TYPE|TATTR)/.test(k))return;if(showMap[k]!==v){showMap[k]=v;showDirty=true;}}
function feedback(line){
  const p=line.split('\t');if(p[0]!=='fb')return;
  rememberShow(p[1]||'',p[2]||'');
  if(/^PINF3\.\d+$/.test(p[1]||'')){PINF[+p[1].slice(6)]=(p[2]||'').split('|');clearTimeout(goboTimer);goboTimer=setTimeout(()=>{if(curTab==='Presets'&&presetType===3)renderGobo();},120);return;}
  if(/^(TYPE|TATTR)/.test(p[1]||'')){typeFeedback(p[1],p[2]||'');return;}
  if(/^ATTR/.test(p[1]||'')){attrFeedback(p[1],p[2]||'');return;}
  if(/^EXEC\d+$/.test(p[1]||'')){applyExec(+p[1].slice(4),p[2]||'');return;}
  if(/^(GRP|PRE\d+\.)/.test(p[1]||'')){poolFeedback(p[1],p[2]||'');return;}
  if(/^LAY/.test(p[1]||'')){layoutFeedback(p[1],p[2]||'');return;}
  if(p[1]==='KEYS'){maTyped=(p[2]==='ok');return;}
  if(p[1]==='SEL'){laySel=(p[2]||'').split(',').filter(Boolean).map(Number);paintLaySel();return;}   // MA's real selection (plugin v17)
  if(p[1]==='CMDLINE')return;   // the command line lives on the iPad
  if(touching>0)return;
  const m=/Page(\d+)\/Fader(\d+)$/.exec(p[1]||'');const v=parseFloat(p[2]);
  if(!m||isNaN(v)||+m[1]!==S.page)return;
  const n=+m[2],val=clamp(v);
  if(n>=300)S.kn[n]=val;else S.f[n]=val;
  scheduleRedraw();
}
function vib(){if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}}
let lastMirror=null,mirrorT=null;
function mirrorCmd(){   // show the iPad command line in onPC's command line (plugin v14 reads it)
  const t=(S.cmd.trim()+(S.storeOpt?' '+S.storeOpt:'')).trim();
  if(t===lastMirror)return;clearTimeout(mirrorT);
  mirrorT=setTimeout(()=>{if(wsOk){try{ws.send('!cmdline\t-\t'+t);lastMirror=t;}catch(e){}}},40);
}
function showCmd(){setTimeout(mirrorCmd,0);if(!S.cmd.trim())S.storeOpt='';cmdEl.innerHTML='<span style="color:#ffc71a">['+S.page+']&gt;</span> '+S.cmd.replace(/</g,'&lt;')+(S.storeOpt?'<span style="color:#b4b3ff"> '+esc(S.storeOpt)+'</span>':'');}

// momentary key (multi-touch safe)
function key(parent,label,style,onDown,onUp,sub){
  const b=el('button','height:40px;'+(style||''),parent);b.className='k';
  b.innerHTML=label+(sub?'<br><span class="sub">'+sub+'</span>':'');
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}b.classList.add('on');vib();onDown&&onDown();});
  const up=e=>{if(!b.classList.contains('on'))return;b.classList.remove('on');onUp&&onUp();};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
  return b;
}
// pool tile: fires on RELEASE (so two-finger swipes and drags don't trigger it)
const GEST={used:false};
function tapKey(parent,label,style,onTap){
  const b=el('button','height:40px;'+(style||''),parent);b.className='k';b.innerHTML=label;let st=null;
  b.addEventListener('pointerdown',e=>{e.preventDefault();st={x:e.clientX,y:e.clientY,id:e.pointerId};b.classList.add('on');});
  b.addEventListener('pointermove',e=>{if(st&&e.pointerId===st.id&&Math.hypot(e.clientX-st.x,e.clientY-st.y)>12*scale){st=null;b.classList.remove('on');}});
  b.addEventListener('pointerleave',()=>{st=null;b.classList.remove('on');});
  b.addEventListener('pointerup',e=>{b.classList.remove('on');const ok=st&&e.pointerId===st.id&&!GEST.used;st=null;if(ok){vib();onTap();}});
  b.addEventListener('pointercancel',()=>{st=null;b.classList.remove('on');});
  b.addEventListener('contextmenu',e=>e.preventDefault());
  return b;
}
// two fingers up/down on a pool = next/previous page
function swipePager(box,onPage){
  const pts=new Map();let y0=null;
  const avg=()=>{let s=0;pts.forEach(v=>s+=v);return s/pts.size;};
  box.addEventListener('pointerdown',e=>{pts.set(e.pointerId,e.clientY);if(pts.size===2){y0=avg();GEST.used=true;box.querySelectorAll('.k.on').forEach(k=>k.classList.remove('on'));}},true);
  box.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e.clientY);
    if(pts.size>=2&&y0!==null){const dy=(avg()-y0)/scale;if(Math.abs(dy)>45){onPage(dy<0?1:-1);y0=avg();vib();}}},true);
  const end=e=>{pts.delete(e.pointerId);if(pts.size<2)y0=null;if(pts.size===0)setTimeout(()=>{GEST.used=false;},0);};
  box.addEventListener('pointerup',end,true);box.addEventListener('pointercancel',end,true);
}
// fader: relative drag, many at once
function fader(parent,style,capW,capColor,get,set){
  const t=el('div',style,parent);t.className='track';
  el('div','',t).className='slot';
  const fl=el('div','',t);fl.className='fill';
  const cp=el('div','width:'+capW+'px;margin-left:-'+(capW/2)+'px;background:'+capColor,t,'<i></i>');cp.className='cap';
  function draw(){const v=get(),h=t.clientHeight-36;fl.style.height=(h*v/100)+'px';cp.style.top=(h*(1-v/100))+'px';}
  let st=null;
  t.addEventListener('pointerdown',e=>{e.preventDefault();try{t.setPointerCapture(e.pointerId)}catch(x){}if(!st)touching++;st={y:e.clientY,v:get()};t.classList.add('on');});
  t.addEventListener('pointermove',e=>{if(!st)return;const h=(t.clientHeight-36)*scale;const nv=clamp(st.v+(st.y-e.clientY)/h*100);if(nv!==get()){set(nv);draw();}});
  const end=()=>{if(st)touching=Math.max(0,touching-1);st=null;t.classList.remove('on');};
  t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end);
  t.draw=draw;return t;
}
function knob(parent,n){
  const k=el('div','',parent,'<i></i>');k.className='knob';
  const draw=()=>{k.style.background='conic-gradient('+(k.col||'#ffc71a')+' '+((S.kn[n]||0)*3.6)+'deg,#3a3a3f 0)';};
  let st=null;
  k.addEventListener('pointerdown',e=>{e.preventDefault();try{k.setPointerCapture(e.pointerId)}catch(x){}st={y:e.clientY,v:S.kn[n]||0};});
  k.addEventListener('pointermove',e=>{if(!st)return;const nv=clamp(st.v+(st.y-e.clientY)/scale*0.6);const d=nv-(S.kn[n]||0);if(d===0)return;S.kn[n]=nv;draw();tx('/Page'+S.page+'/Encoder'+n,'i',d);});
  const end=()=>{st=null};k.addEventListener('pointerup',end);k.addEventListener('pointercancel',end);
  k.draw=draw;draw();return k;
}
// ===== executor names / colors from MA (plugin v5: EXECnnn=name|#rrggbb) =====
const EX={};   // n -> {keys:[{b,num,mark}], track, knob}
function exReg(n,part,el,mark){const e=EX[n]||(EX[n]={keys:[]});if(part==='key')e.keys.push({b:el,num:String(n),mark:mark||''});else e[part]=el;return el;}
function shade(hex,f){const v=parseInt(hex.slice(1),16);const r=(v>>16)&255,g=(v>>8)&255,b=v&255;
  return 'rgb('+Math.round(r*f)+','+Math.round(g*f)+','+Math.round(b*f)+')';}
function lum(hex){const v=parseInt(hex.slice(1),16);return (0.299*((v>>16)&255)+0.587*((v>>8)&255)+0.114*(v&255))/255;}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const EXNAME={};
function applyExec(n,v){
  const q0=String(v).split('|');EXNAME[n]=(q0[0]||'').trim();
  const e=EX[n];if(!e)return;
  const q=String(v).split('|');const name=(q[0]||'').trim();const col=/^#[0-9a-f]{6}$/i.test(q[1]||'')?q[1]:'';
  e.keys.forEach(k=>{
    const isX=k.mark.indexOf('X')===0;
    if(isX){const xl=k.mark.split('|');   // Xkeys: name from the show, or the console label
      k.b.innerHTML=name?'<span class="nm">'+esc(name)+'</span><span class="sub">'+xl[0]+'</span>':xl[0]+'<br><span class="sub">'+(xl[1]||'')+'</span>';}
    else k.b.innerHTML=(name?'<span class="nm">'+esc(name)+'</span>':k.num+'<br>')+'<span class="sub">'+(name?k.num:k.mark)+'</span>';
    if(col){k.b.style.background=shade(col,0.42);k.b.style.boxShadow='inset 0 3px 0 '+col+', 0 2px 0 #000';k.b.style.color=lum(col)>0.85?'#fff':'#fff';}
    else{k.b.style.background='';k.b.style.boxShadow='';k.b.style.color='';}
    if(!isX)k.b.style.fontSize=name&&name.length>6?'10px':'';
  });
  if(e.track){const fl=e.track.querySelector('.fill');const cp=e.track.querySelector('.cap i');
    fl.style.background=col||'';cp.style.background=col||'';e.track.style.boxShadow=col?'inset 0 3px 0 '+col:'';}
  if(e.knob){e.knob.col=col||'';e.knob.draw();}
}

// command line keypad logic
// Command keys are TYPED into the real MA command line on the laptop (the bridge
// acts as a keyboard), exactly like pressing the key on a console: "Store" waits in MA's
// command line and you can finish it with the mouse in onPC or with an executor key.
// S.cmd only mirrors what we typed (MA may consume it when you click in onPC).
// Finish a pending command with an object. Works whether onPC is visible or minimized:
// Esc clears what we typed into MA (skipped by the bridge if onPC is minimized), then the whole
// command goes over OSC, e.g. "Store Preset 2.3".
let maTyped=true;      // false when the bridge could not type into onPC (minimized)
function completeWith(obj){
  let c=S.cmd.trim();
  // Assign/Copy/Move/Clone without a source yet: the tapped object is the SOURCE, so just put it
  // into the command line and wait for the target (e.g. Assign, Group 5, then fader key 201)
  if(/^(Assign|Copy|Move|Clone)$/i.test(c)){const t=' '+obj+' ';typeText(t);S.cmd=c+t;showCmd();osc('linia komend: '+S.cmd+' (wybierz cel)');return;}
  // Assign/Copy/Move/Clone need "At" before the target: "Assign Group 5 At Exec 201"
  if(/^(Assign|Copy|Move|Clone)\b/i.test(c)&&/\d/.test(c)&&!/\b(At|Thru|\+|-)$/i.test(c))c+=' At';
  if(/^Store$/i.test(c)&&!S.storeOpt){const ex=storeTargetExists(obj);
    if(ex){openStoreOpts({cmd:c,obj:obj,label:ex.label});return;}}
  if(/^Assign\b.*\d/i.test(c)&&/^Exec \d+$/.test(obj)){const ex=storeTargetExists(obj);   // Assign ... onto an occupied executor
    if(ex){openStoreOpts({cmd:c+(/\bAt$/i.test(c)?'':' At'),obj:obj,label:ex.label,assign:true});return;}}
  typeKey('{ESC}');cmdSend(c+' '+obj+(S.storeOpt&&/^Store\b/i.test(c)?' '+S.storeOpt:''));S.cmd='';S.storeOpt='';showCmd();
}
// Wing mode: nothing is typed into onPC (keyboard shortcuts may stay OFF). The command line is built
// on the iPad and only the complete command is sent over OSC (/cmd), like a hardware wing.
function typeText(t){}
function typeKey(k){}
// press/release of a real MA key via its keyboard shortcut (Store=S, Update=U): holding works like on the console
function holdKey(dir,letter){}
function holdBtn(parent,label,letter,bg,fg){
  let held=false,timer=null,longp=false;
  return key(parent,label,'height:auto;min-height:0;background:'+bg+';color:'+fg,
    ()=>{holdKey('d',letter);held=true;longp=false;const c=S.cmd;const lw=(c.trim().split(/\s+/).pop()||'');
      if(lw===label&&label==='Update'&&c.trim()==='Update'){cmdSend('Update');S.cmd='';showCmd();osc('Update Update = menu Update');return;}
      if(lw!==label)S.cmd=c+(c&&!/ $/.test(c)?' ':'')+label+' ';showCmd();
      osc(label+(letter==='S'?' – wybierz cel (przytrzymaj = opcje Store)':' – wybierz cel'));
      if(letter==='S'){clearTimeout(timer);timer=setTimeout(()=>{if(held){holdKey('u',letter);held=false;longp=true;openStoreOpts();}},350);}},
    ()=>{clearTimeout(timer);if(held){holdKey('u',letter);held=false;}});
}
// ===== Store options (like MA's Store window): Merge / Overwrite / Remove / Create Second Cue ...
// Chosen option is appended at the end: "Store Preset 2.4 /Merge"
S.storeOpt='';
const SOPTS=[['/Merge','Merge','Dodaje nowe wartości do istniejących'],['/Overwrite','Overwrite','Zastępuje całą zawartość'],
  ['/Remove','Remove','Usuwa wartości z programatora z obiektu'],['/CreateSecondCue','Create Second Cue','Tworzy drugi cue w sekwencji']];
const SFLAGS=[['/CueOnly','Cue Only'],['/Selective','Selective'],['/Global','Global'],['/Universal','Universal']];
let soFlags=[],soPending=null;
const soWrap=el('div','position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9',stage);

    const words=c.trim()?c.trim().split(/\s+/):[],last=(words[words.length-1]||'');
    const chain=KEYCYCLE[v],idx=chain?chain.findIndex(w=>w.toLowerCase()===last.toLowerCase()):-1;
